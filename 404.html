<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />

  <title data-i18n="404.pageTitle">Page not found — Farmand Bazdiditehrani</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />

  <!-- Same pre-paint theme snippet as index.html (no reveal gating needed here) -->
  <script>
    (function () {
      var t, lang;
      /* Same guard as index.html: blocked site data must not throw here. */
      try {
        t    = localStorage.getItem('theme');
        lang = localStorage.getItem('lang');
      } catch (e) {}
      if (t !== 'dark' && t !== 'light') {
        t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = t;
      document.documentElement.lang = lang === 'de' ? 'de' : 'en';
    }());
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=swap" />

  <link rel="stylesheet" href="/styles.css" />
  <style>
    /* One-off layout for the error page; everything else comes from styles.css */
    .nf-wrap {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: var(--sp-5);
    }
    .nf-code {
      font-family: var(--font-display);
      font-style: italic;
      font-weight: 500;
      font-size: clamp(4rem, 14vw, 6rem);
      line-height: 1;
      color: var(--accent);
    }
    .nf-title {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 500;
      color: var(--ink);
    }
    .nf-text {
      max-width: 33.75rem;
      color: var(--ink-soft);
    }
  </style>
</head>
<body>
  <main class="container nf-wrap">
    <p class="nf-code" aria-hidden="true">404</p>
    <h1 class="nf-title" data-i18n="404.title">This page doesn't exist.</h1>
    <p class="nf-text" data-i18n="404.text">
      The address may be mistyped, or the page has moved.
      Everything worth seeing lives on the home page.
    </p>
    <a class="btn" href="/" data-i18n="404.back">Back to the home page</a>
  </main>

  <!-- No switch on the error page; it follows the language chosen on the site. -->
  <script src="/i18n.js" defer></script>
</body>
</html>
